<svg viewBox="0 0 100 100" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tumaraFaviconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <linearGradient id="tumaraFaviconStem" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="tumaraFaviconArrow" x1="0%" y1="50%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="100" height="100" rx="24" fill="url(#tumaraFaviconBg)" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Vertical Stem — Rooted Growth ("Tumbuh") -->
  <rect x="42" y="32" width="16" height="44" rx="8" fill="url(#tumaraFaviconStem)" />

  <!-- Horizontal Bar with Directional Arrow Vector ("Arah") -->
  <path d="M 22 28 C 22 23.5 25.5 20 30 20 L 68 20 C 72.5 20 76 23.5 76 28 C 76 32.5 72.5 36 68 36 L 30 36 C 25.5 36 22 32.5 22 28 Z" fill="url(#tumaraFaviconArrow)" />

  <!-- Dynamic Directional Tip (Arrow Head surging forward & upward) -->
  <path d="M 68 15 L 84 28 L 68 41 Z" fill="url(#tumaraFaviconArrow)" />

  <!-- Core Growth Sprout Accent -->
  <circle cx="50" cy="70" r="4.5" fill="#A7F3D0" />
</svg>
